[project]
name = "sift"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-c>=0.24.2",
  "tree-sitter-cpp>=0.23.4",
]

[project.scripts]
sift = "sift.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
